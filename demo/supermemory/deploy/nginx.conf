upstream supermemory_bun {
    server WEBAGENT_UPSTREAM;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name supermemory.agentnet.it.com;

    location /live {
        proxy_pass http://supermemory_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://supermemory_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
