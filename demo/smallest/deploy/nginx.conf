# Demo pattern: static site (optional) + proxy the webagent.
# Live smallest.agentnet.it.com can keep proxying everything to bun;
# GET / is the widget shell. widget.js / chat / mcp / live stay on the agent.

upstream smallest_bun {
    server WEBAGENT_UPSTREAM;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name smallest.agentnet.it.com;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    location /live {
        proxy_pass http://smallest_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://smallest_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
