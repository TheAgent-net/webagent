# webagent cloud: every tenant on one service.
# Cloudflare is in front. nginx proxies to bun on :8790.
# Add each tenant custom domain to server_name. Keep the Host header: the cloud maps a custom domain to its tenant.
# Copy to /etc/nginx/conf.d/webagent-cloud.conf. deploy/cloud.sh does this when WEBAGENT_NGINX=1.

# Cloudflare sends X-Forwarded-Proto. Use the local scheme when it is missing.
map $http_x_forwarded_proto $cloud_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream cloud_bun {
    server 127.0.0.1:8790;
    keepalive 32;
}

server {
    listen 80;
    # For Cloudflare "Full (strict)", install a Cloudflare origin certificate and remove the comment marks.
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    server_name cloud.agentnet.it.com supermemory.agentnet.it.com;

    # Chat requests are small. Stop large bodies at the edge.
    client_max_body_size 256k;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    # Server-sent events: /t/<id>/live, and /live on a custom domain.
    # No buffering. Long read time. No gzip.
    location ~ ^(/t/[a-z0-9][a-z0-9_-]*)?/live {
        proxy_pass http://cloud_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cloud_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://cloud_bun;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cloud_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
