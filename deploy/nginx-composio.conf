# Composio webagent — dedicated Host only. Do not add this to the
# app.agentnet.market server. Insert into the docker nginx default.conf
# and reload. WEBAGENT_UPSTREAM is replaced by deploy/front.sh.

server {
    listen 80;
    server_name ec2-54-89-43-219.compute-1.amazonaws.com;

    location / {
        proxy_pass http://WEBAGENT_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
