# Composio webagent — dedicated Host only. Do not add this to the
# app.agentnet.market server. Insert into the docker nginx default.conf
# and reload. WEBAGENT_UPSTREAM is replaced by deploy/front.sh.
#
# listen 443 only when a Let's Encrypt cert is in the nginx certs bind-mount.
# front.sh does not generate a self-signed fallback.

server {
    listen 80;
    listen 443 ssl;
    server_name composio.agentnet.it.com ec2-54-89-43-219.compute-1.amazonaws.com;
    ssl_certificate /etc/nginx/certs/composio.crt;
    ssl_certificate_key /etc/nginx/certs/composio.key;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/certs/acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://WEBAGENT_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
